name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev
      - name: Verify Apache tracing shim
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dependency_tree="$(cargo tree --locked --features desktop --edges normal,build --prefix none)"
          printf '%s\n' "$dependency_tree" | grep -F 'crates/ztracing-shim'
          if printf '%s\n' "$dependency_tree" | grep -Eq '^(zlog|ztracing_macro) v|^ztracing .*github.com/zed'; then
            echo 'GPL tracing dependencies must remain replaced by the local Apache-2.0 shim.' >&2
            exit 1
          fi
      - name: Test core and directory-link behavior
        run: cargo test --locked
      - name: Check desktop app
        run: cargo check --locked --features desktop --bin kitter-desktop

  windows-build:
    name: Windows build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop app and standalone CLI
        run: cargo build --release --locked --features desktop --bin kitter-desktop --bin kitter
      - uses: actions/upload-artifact@v4
        with:
          name: kitter-windows-x86_64
          path: |
            target/release/kitter-desktop.exe
            target/release/kitter.exe
          if-no-files-found: error
